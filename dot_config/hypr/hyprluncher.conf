# ------------ General ------------
general {
    # Always grab focus so you can instantly type
    grab_focus = true
}

# ------------ Cache ------------
cache {
    # Keep frequency-based history so common apps float to the top
    enabled = true
}

# ------------ Finders ------------
finders {
    # default finder: applications via .desktop files
    default_finder      = desktop

    # Prefixes (one character each)
    # Type ".fire" to search unicode, "=2+2" for math, etc.
    desktop_prefix      =
    unicode_prefix      = .
    math_prefix         = =
    font_prefix         = '

    # If you use a wrapper (uwsm, gamescope, etc.), set it here
    # desktop_launch_prefix = uwsm app -- 

    # Show icons for desktop entries
    desktop_icons       = true
}

# ------------ UI ------------
ui {
    # Wider window looks nicer and fits more entries
    window_size = 600 360
}
