# Session environment for portals, systemd user services, and DBus apps.
exec-once = sh -lc 'dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE'
exec-once = sh -lc 'systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XCURSOR_SIZE HYPRCURSOR_SIZE'

# Core desktop services. Missing commands are skipped so first boot stays clean.
exec-once = sh -lc 'command -v hyprpolkitagent >/dev/null && hyprpolkitagent'
exec-once = sh -lc '~/.config/hypr/scripts/start-foot-server.sh'
exec-once = sh -lc 'command -v hyprpaper >/dev/null && hyprpaper || { command -v swww-daemon >/dev/null && swww-daemon; }'
exec-once = sh -lc 'sleep 1; ~/.config/hypr/scripts/change_wallpaper.sh'
exec-once = sh -lc 'command -v hypridle >/dev/null && hypridle'
exec-once = sh -lc 'command -v mako >/dev/null && mako'
exec-once = sh -lc 'command -v waybar >/dev/null && waybar'

# Applets.
exec-once = sh -lc '~/.config/hypr/scripts/network-manager.sh applet'
exec-once = sh -lc 'command -v blueman-applet >/dev/null && blueman-applet'

# SSH and clipboard helpers.
exec-once = sh -lc 'test -x ~/.local/bin/start-ssh-agent.sh && ~/.local/bin/start-ssh-agent.sh'
exec-once = sh -lc 'command -v wl-paste >/dev/null && command -v cliphist >/dev/null && wl-paste --type text --watch cliphist store'
exec-once = sh -lc 'command -v wl-paste >/dev/null && command -v cliphist >/dev/null && wl-paste --type image --watch cliphist store'
