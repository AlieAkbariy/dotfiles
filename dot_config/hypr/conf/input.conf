input {
    kb_layout = us,ir
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =

    follow_mouse = 1
    numlock_by_default = true
    repeat_rate = 45
    repeat_delay = 250

    sensitivity = 0
    accel_profile = adaptive

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
        disable_while_typing = true
        scroll_factor = 0.35
    }
}

gesture = 3, horizontal, workspace

device {
    name = logitech-gaming-mouse-g402
    sensitivity = -0.15
    accel_profile = flat
}
