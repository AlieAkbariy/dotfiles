general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2

    col.active_border = rgba(7dd3c7ee) rgba(e6a4b4ee) 45deg
    col.inactive_border = rgba(4a505daa)

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 9
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 0.96

    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(05070cee)
        color_inactive = rgba(05070c88)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.12
    }
}

animations {
    enabled = true

    bezier = emphasized, 0.16, 1, 0.3, 1
    bezier = standard, 0.2, 0, 0, 1
    bezier = quick, 0.15, 0, 0.1, 1

    animation = windows, 1, 4, emphasized, popin 86%
    animation = windowsOut, 1, 3, standard, popin 88%
    animation = border, 1, 5, standard
    animation = fade, 1, 3, quick
    animation = layers, 1, 4, emphasized
    animation = workspaces, 1, 4, emphasized, slide
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
    mfact = 0.62
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# Polite defaults for common floating utility windows.
windowrule = match:class .*, suppress_event maximize
windowrule = match:class ^(pavucontrol)$, float true
windowrule = match:class ^(pavucontrol)$, size 900 600
windowrule = match:class ^(pavucontrol)$, center true
windowrule = match:class ^(blueman-manager)$, float true
windowrule = match:class ^(blueman-manager)$, size 720 560
windowrule = match:class ^(blueman-manager)$, center true
windowrule = match:class ^(nm-connection-editor)$, float true
windowrule = match:class ^(nm-connection-editor)$, size 760 560
windowrule = match:class ^(nm-connection-editor)$, center true
windowrule = match:title ^(Picture-in-Picture)$, float true
windowrule = match:title ^(Picture-in-Picture)$, pin true
windowrule = match:class ^$,match:title ^$,match:xwayland 1, no_initial_focus on
