# -*- conf -*-

app-id=foot
title=Terminal
term=foot

# Strict mono metrics keep shell tables, prompts, and Nerd Font glyphs aligned.
font=Hack Nerd Font Mono:size=11
font-bold=Hack Nerd Font Mono:style=Bold:size=11
font-italic=Hack Nerd Font Mono:style=Italic:size=11
font-bold-italic=Hack Nerd Font Mono:style=Bold Italic:size=11
letter-spacing=0
underline-offset=2px
underline-thickness=1px
box-drawings-uses-font-glyphs=no

pad=18x14 center
initial-window-size-chars=118x34
resize-by-cells=yes
resize-keep-grid=yes
bold-text-in-bright=no
dpi-aware=no

[scrollback]
lines=30000
multiplier=3.0

[url]
launch=xdg-open ${url}
osc8-underline=url-mode

[cursor]
style=beam
blink=yes
beam-thickness=1.2

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.95
background=0d1117
foreground=c9d1d9

regular0=484f58
regular1=ff7b72
regular2=7ee787
regular3=d29922
regular4=79c0ff
regular5=d2a8ff
regular6=a5d6ff
regular7=b1bac4

bright0=6e7681
bright1=ffa198
bright2=56d364
bright3=e3b341
bright4=a5d6ff
bright5=bc8cff
bright6=39c5cf
bright7=f0f6fc

selection-foreground=f0f6fc
selection-background=264f78
jump-labels=0d1117 e3b341
search-box-no-match=0d1117 ff7b72
search-box-match=0d1117 e3b341
urls=79c0ff

[bell]
urgent=no
notify=no
visual=yes

[csd]
preferred=server

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
search-start=Control+Shift+f
spawn-terminal=Control+Shift+n
